# Managed by router-ip-push-hardening.
# Automatic bans are deliberately scoped to TCP/443 only.

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = ufw prepend deny proto tcp from <ip> to any port 443 comment riph-f2b-<name>
actionunban = ufw --force delete deny proto tcp from <ip> to any port 443
