# Managed by router-ip-push-hardening.
# Automatic bans are deliberately scoped to TCP/443 only.
# The helper owns rules by exact riph-f2b-<name> marker so unban cannot delete
# an unrelated/manual deny for the same source address.

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/riph-fail2ban-ufw ban <name> <ip>
actionunban = /usr/local/sbin/riph-fail2ban-ufw unban <name> <ip>
