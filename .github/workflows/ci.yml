name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash / ShellCheck / tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck fail2ban

      - name: Local regression suite
        run: bash tests/run-local.sh
